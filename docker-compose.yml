version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: olt_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: olt_monitoring
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: olt_user
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: olt_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  db_data:
