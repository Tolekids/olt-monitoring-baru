type: object
required: [id, name, vendor, model, device_type, management_ip, status, is_polling_enabled]
properties:
  id:
    type: integer
    format: int64
  name:
    type: string
  vendor:
    type: string
    enum: [zte, mikrotik]
  model:
    type: string
  device_type:
    type: string
    enum: [olt, router]
  management_ip:
    type: string
    format: ipv4
  status:
    type: string
    enum: [unknown, online, offline]
  is_polling_enabled:
    type: boolean
  last_seen_at:
    type: string
    format: date-time
    nullable: true
  last_error:
    type: string
    nullable: true
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
