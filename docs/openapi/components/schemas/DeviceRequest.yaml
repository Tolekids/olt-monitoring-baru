type: object
required: [name, vendor, model, device_type, management_ip]
properties:
  name:
    type: string
    maxLength: 255
  vendor:
    type: string
    enum: [zte, mikrotik]
  model:
    type: string
    maxLength: 100
  device_type:
    type: string
    enum: [olt, router]
  management_ip:
    type: string
    format: ipv4
  is_polling_enabled:
    type: boolean
    default: true
  credentials:
    type: object
    properties:
      protocol:
        type: string
        enum: [snmp_v2c, snmp_v3, ssh, telnet, routeros_api]
      port:
        type: integer
        minimum: 1
        maximum: 65535
      username:
        type: string
      password:
        type: string
        format: password
      community:
        type: string
        format: password
