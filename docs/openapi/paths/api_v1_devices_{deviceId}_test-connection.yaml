post:
  security: [{sanctum: []}]
  tags: [Devices]
  operationId: devicesTestConnection
  summary: Test device connectivity
  parameters:
    - in: path
      name: deviceId
      required: true
      schema: {type: integer}
  responses:
    '200':
      description: Connection test result.
    '403':
      description: Forbidden.
    '404':
      description: Device not found.
