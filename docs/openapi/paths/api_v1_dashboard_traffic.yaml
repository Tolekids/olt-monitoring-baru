get:
  security: [{sanctum: []}]
  tags: [Dashboard]
  operationId: dashboardTraffic
  summary: Get dashboard traffic samples
  parameters:
    - in: query
      name: device_id
      schema: {type: integer}
    - in: query
      name: from
      schema: {type: string, format: date-time}
    - in: query
      name: to
      schema: {type: string, format: date-time}
  responses:
    '200':
      description: Traffic samples.
    '401':
      description: Unauthenticated.
